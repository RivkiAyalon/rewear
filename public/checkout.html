<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout — ReWear</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <div id="navbar"></div>

  <main class="container page">

    <div class="checkout-page">

      <!-- ===== מסך התשלום ===== -->
      <div id="checkoutView">

        <h1>Checkout</h1>



        <!-- סיכום הפריט -->
        <section class="panel" id="productSummary">

          <h2>Your item</h2>

          <div class="summary-item">
            <img id="productImage" src="" alt="Product">
            <div>
              <strong id="productTitle"></strong>
              <div class="muted small" id="productSeller"></div>
              <div class="card-price mt" id="productPrice"></div>
            </div>
          </div>

        </section>


        <!-- אמצעי תשלום -->
        <section class="panel mt">

          <h2>Payment method</h2>

          <label class="pay-option">
            <input type="radio" name="paymentMethod" value="card" checked>
            <span>Credit card</span>
          </label>

          <label class="pay-option" id="pointsOption">
            <input type="radio" name="paymentMethod" value="points" id="pointsRadio">
            <span>
              Points
              <span class="muted small" id="pointsMessage"></span>
            </span>
          </label>

        </section>


        <!-- פרטי כרטיס -->
        <section class="panel mt" id="cardSection">

          <h2>Card details</h2>

          <div class="card-fields">

            <div class="field">
              <label for="cardHolder">Cardholder name</label>
              <input class="input" id="cardHolder" type="text"
                     placeholder="As it appears on the card">
            </div>

            <div class="field">
              <label for="cardNumber">Card number</label>
              <input class="input" id="cardNumber" type="text"
                     inputmode="numeric" autocomplete="off"
                     placeholder="4242 4242 4242 4242">
            </div>

            <div class="field">
              <label for="expiry">Expiry</label>
              <input class="input" id="expiry" type="text"
                     placeholder="MM/YY" autocomplete="off" maxlength="5">
            </div>

            <div class="field">
              <label for="cvv">CVV</label>
              <input class="input" id="cvv" type="password"
                     inputmode="numeric" maxlength="3" autocomplete="off"
                     placeholder="123">
            </div>

          </div>

        </section>


        <button class="btn btn-primary btn-lg btn-block mt" id="payButton">
          Confirm purchase
        </button>

        <p id="checkoutMessage" class="field-error"></p>

      </div>


      <!-- ===== מסך אישור — מוצג רק אחרי רכישה ===== -->
      <div id="successView" class="hidden">

        <div class="panel success-panel">

          <div class="success-mark">✓</div>

          <h1>Purchase completed</h1>

          <p class="lead">
            Thank you! Your order has been placed.
          </p>

          <div class="demo-note mt">
            <strong>What happens next</strong><br>
            Our team will contact you with the seller's details
            so you can arrange a pickup time together.
          </div>

          <div id="successSummary" class="mt"></div>

          <div class="flex gap mt">
            <a class="btn btn-primary" href="/profile.html?tab=orders">
              View my orders
            </a>
            <a class="btn btn-outline" href="/shop.html">
              Keep shopping
            </a>
          </div>

        </div>

      </div>

    </div>

  </main>

  <div id="footer"></div>

  <script src="/js/common.js"></script>
  <script src="/js/checkout.js"></script>

</body>

</html>
