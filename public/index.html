<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReWear — Give clothes a second life</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="navbar"></div>

  <main>
    <section class="hero">
      <p>Git collaboration test</p>
      <div class="container hero-inner">
        <h1>Give clothes a<br>second life.</h1>
        <p>Buy and sell pre-loved fashion. Sell an item, earn points, spend them on something new to you.</p>
        <div class="flex gap">
          <a href="/shop.html" class="btn btn-primary btn-lg">Browse items</a>
          <a href="/how-it-works.html" class="btn btn-outline btn-lg">How it works</a>
        </div>
      </div>
    </section>

    <section class="container">
      <div class="cat-row">
        <a href="/shop.html?gender=women" class="cat-tile">Women</a>
        <a href="/shop.html?gender=men" class="cat-tile">Men</a>
        <a href="/shop.html?gender=kids" class="cat-tile">Kids</a>
      </div>
    </section>

    <section class="container mt">
      <div class="flex between center mb">
        <h2>New arrivals</h2>
        <a href="/shop.html" class="nav-link">View all</a>
      </div>
      <div id="latest"><div class="spinner"></div></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="/js/common.js"></script>
  <script src="/js/home.js"></script>
