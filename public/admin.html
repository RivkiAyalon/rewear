<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — ReWear</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="navbar"></div>

  <main class="container page">
  <h1>Dashboard</h1>

  <div class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="users">Users</button>
    <button class="tab" data-tab="orders">Orders</button>
    <button class="tab" data-tab="products">Products</button>
    <button class="tab" data-tab="messages">Messages</button>
  </div>

  <!-- ===== מפתחת 5 — כרטיסים וגרפים ===== -->
  
  <section id="tab-overview" class="tab-panel">
  <div id="adminStats"><div class="spinner"></div></div>

  <div class="charts-row">
    <div class="panel">
      <h3>Revenue by month</h3>
      <canvas id="salesChart"></canvas>
    </div>
    <div class="panel">
      <h3>Top sellers</h3>
      <canvas id="sellersChart"></canvas>
    </div>
  </div>
</section>

  <!-- ===== רבקי — משתמשות ===== -->
  <section id="tab-users" class="tab-panel hidden">
    <div id="usersTable"><div class="spinner"></div></div>
  </section>

  <!-- ===== רבקי — הזמנות ===== -->
  <section id="tab-orders" class="tab-panel hidden">
    <p class="muted">Contact details for connecting buyers and sellers.</p>
    <div id="ordersTable"><div class="spinner"></div></div>
  </section>

  <!-- ===== מפתחת 5 — מוצרים ===== -->
  <section id="tab-products" class="tab-panel hidden">
  <div class="flex gap mb">
    <input class="input" id="productSearch" type="search"
           placeholder="Search by title or brand" style="max-width:280px">
    <select class="select" id="productStatus" style="width:auto">
      <option value="">All</option>
      <option value="available">Available</option>
      <option value="sold">Sold</option>
    </select>
  </div>
  <div id="adminProducts"><div class="spinner"></div></div>
</section>

  <!-- ===== מפתחת 5 — הודעות ===== -->
  <section id="tab-messages" class="tab-panel hidden">
    <div id="adminMessages"><div class="empty"><h3>Coming soon</h3></div></div>
  </section>
</main>

  <div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
